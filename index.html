<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treino de frontend com js</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="cadastro">
        <form class="forms">
            <h1>Cadastro de funcionários</h1>

            <label>Nome:</label>
            <input type="text" placeholder="Nome completo" minlength="15">

           
                <div class="sexo">
                    <label>Sexo:</label>
                    <input type="radio" name="Homem">
                    <label>Homem</label>
                    <input type="radio" name="Mulher">
                    <label>Mulher</label>
                </div>

            <div class="email">
                <label>E-mail:</label>
                <input type="email" placeholder="Insira seu email" required>
            </div>

            <div class="Função">
                <label>Função</label>
                <input type="text" placeholder="Função" required>
            </div>

            <div class="Matricula">
                <label>Matricula</label>
                <input type="number" placeholder=" required" minlength="5">
            </div>

            
        </form>
    </section>
</body>
<script src="function.js"></script>
</html>
